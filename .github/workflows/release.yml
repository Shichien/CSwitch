name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            rust_target: ""
            args: --bundles nsis,msi
          - name: Windows ARM64
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles msi
          - name: macOS universal
            os: macos-15
            rust_target: universal-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Linux x64
            os: ubuntu-22.04
            rust_target: ""
            args: --bundles appimage,deb
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            rust_target: ""
            args: --bundles appimage,deb

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Verify release version
        run: node scripts/check-release-version.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Add Rust target
        if: matrix.rust_target != '' && matrix.rust_target != 'universal-apple-darwin'
        run: rustup target add ${{ matrix.rust_target }}

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Detect Apple signing credentials
        if: runner.os == 'macOS'
        id: apple-signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple certificate
        if: runner.os == 'macOS' && steps.apple-signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo build --manifest-path src-tauri/Cargo.toml
      - run: python scripts/run-process-tests.py

      - name: Build unsigned release
        if: runner.os != 'macOS' || steps.apple-signing.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CSwitch v__VERSION__
          releaseBody: CSwitch v__VERSION__
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build signed release
        if: runner.os == 'macOS' && steps.apple-signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CSwitch v__VERSION__
          releaseBody: CSwitch v__VERSION__
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish all platform assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file "docs/releases/$GITHUB_REF_NAME.md"
