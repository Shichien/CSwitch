[package]
name = "cswitch"
version = "0.1.13"
edition = "2024"
license = "MIT"
description = "Codex provider switcher"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.29"
async-stream = "0.3"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs"] }
sysinfo = "0.37"
tauri-plugin-single-instance = "2"
base64 = "0.22.1"
chrono = "0.4.42"
directories = "6.0.0"
fs2 = "0.4.3"
rand = "0.9.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "system-proxy", "socks", "stream"] }
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tiny_http = "0.12.0"
toml_edit = "0.23.7"
url = "2.5.7"
webbrowser = "1.0.6"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
